name: Compile Environment Setup

# This is a resuable workflow: https://docs.github.com/en/actions/sharing-automations/reusing-workflows

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

jobs:
  setup_environment:
    runs-on: ${{ inputs.os }}
    strategy:
      matrix:
        os:
        - macOS-latest
        - ubuntu-latest
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: ConorMacBride/install-package@v1
        with:
          brew: autoconf automake cmake ninja popt python python3 python-setuptools
          apt: clang cmake ninja-build libavahi-client-dev libpopt-dev gdb python3-dev python3-setuptools
      - run: which python3
      - name: Check Ninja Installation
        run: ninja --version || echo "Ninja not found"